services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopsphere
      POSTGRES_PASSWORD: shopsphere_dev
      POSTGRES_DB: shopsphere
    ports:
      - "5432:5432"
    volumes:
      - shopsphere_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopsphere -d shopsphere"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  shopsphere_pg:
